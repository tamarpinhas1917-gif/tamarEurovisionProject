<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta charset="UTF-8">
    <title>PREVIEW - Eurovision | הרשמה / התחברות</title>
    <style>
        :root {
            --euro-purple: #14052d;
            --euro-pink: #ff0085;
            --euro-blue: #00b1ea;
            --euro-yellow: #fdf200;
            --deep-navy: #050514;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--deep-navy) 0%, var(--euro-purple) 100%);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* סרגל ניווט שקוף ומודרני */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-sizing: border-box;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .euro-logo {
            height: 60px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .euro-logo:hover {
            transform: scale(1.05);
        }

        .user-display {
            font-size: 0.9rem;
            color: var(--euro-yellow);
            font-weight: 500;
        }

        .user-display a {
            color: var(--euro-yellow);
            text-decoration: none;
        }

        .user-display a:hover {
            text-decoration: underline;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
            font-size: 1rem;
        }

        nav a:hover {
            color: var(--euro-pink);
        }

        /* Floating gradient shapes (matching HOME) */
        .floating-shape {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 20s infinite ease-in-out;
            z-index: 0;
            pointer-events: none;
        }

        .shape1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--euro-pink), transparent);
            top: -10%;
            left: -10%;
            animation-delay: 0s;
        }

        .shape2 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, var(--euro-blue), transparent);
            top: 40%;
            right: -5%;
            animation-delay: 5s;
        }

        .shape3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--euro-yellow), transparent);
            bottom: -10%;
            left: 20%;
            animation-delay: 10s;
        }

        .shape4 {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, var(--euro-pink), transparent);
            bottom: 30%;
            right: 30%;
            animation-delay: 15s;
        }

        .shape5 {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, var(--euro-blue), transparent);
            top: 20%;
            left: 50%;
            animation-delay: 8s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(30px, -30px) scale(1.1);
            }
            50% {
                transform: translate(-20px, 20px) scale(0.9);
            }
            75% {
                transform: translate(20px, 30px) scale(1.05);
            }
        }

        /* Eurovision Heart Decoration */
        .euro-heart-decoration {
            position: fixed;
            top: 15%;
            right: 10%;
            width: 200px;
            opacity: 0.4;
            filter: blur(3px);
            pointer-events: none;
            z-index: 0;
            animation: heartPulse 4s infinite ease-in-out;
        }

        /* Israel Flag */
        .carousel-winner-flag {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 100;
            animation: float 6s infinite ease-in-out;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
        }

        @keyframes heartPulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.4;
            }
            50% {
                transform: scale(1.05);
                opacity: 0.5;
            }
        }

        /* Auth Container */
        .auth-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 100px 20px 50px;
            position: relative;
            z-index: 1;
        }

        .auth-box {
            background: rgba(20, 5, 45, 0.7);
            backdrop-filter: blur(20px);
            padding: 50px 40px;
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .auth-tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .tab-button {
            flex: 1;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.2rem;
            font-weight: 600;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .tab-button.active {
            color: var(--euro-pink);
            border-bottom-color: var(--euro-pink);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        h2 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, var(--euro-pink), var(--euro-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: var(--euro-yellow);
            font-size: 0.9rem;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 8px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--euro-pink);
            background: rgba(255, 255, 255, 0.08);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--euro-pink), var(--euro-blue));
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 0, 133, 0.4);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: var(--euro-yellow);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: white;
        }

        .already-signed-in {
            text-align: center;
            padding: 30px;
            background: rgba(0, 177, 234, 0.1);
            border-radius: 15px;
            border: 2px solid var(--euro-blue);
        }

        .already-signed-in h3 {
            color: var(--euro-blue);
            margin-bottom: 15px;
        }

        .already-signed-in p {
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--euro-blue), var(--euro-purple));
        }
    </style>
</head>
<body>
    <!-- Floating Eurovision Gradient Shapes -->
    <div class="floating-shape shape1"></div>
    <div class="floating-shape shape2"></div>
    <div class="floating-shape shape3"></div>
    <div class="floating-shape shape4"></div>
    <div class="floating-shape shape5"></div>

    <!-- Eurovision Heart Decoration -->
    <img class="euro-heart-decoration" src="https://www.eurovision.com/static/images/70-heart.f6c629bcf5dd.webp" 
         srcset="https://www.eurovision.com/static/images/70-heart.f6c629bcf5dd.webp, https://www.eurovision.com/static/images/70-heart@2x.0fe89b9ce3a9.webp 2x" 
         alt="Eurovision Heart">

    <!-- Israel Flag -->
    <img class="carousel-winner-flag" src="https://storage.googleapis.com/eurovision-com.appspot.com/public/core_data/flag_il.svg" 
         alt="Israel flag in a eurovision heart" width="50">

    <header>
        <div class="logo-container">
            <a href="home-preview.html" style="text-decoration: none;">
                <img src="https://www.eurovision.com/static/images/70-logo.ba56318cd52f.webp" alt="Eurovision 70" class="euro-logo">
            </a>
            <div class="user-display" id="userDisplay">
                <a href="login-preview.html">הרשמה / התחברות</a>
            </div>
        </div>
        <nav>
            <ul>
                <li><a href="home-preview.html">דף הבית</a></li>
                <li><a href="timeline-preview.html">ציר הזמן</a></li>
                <li><a href="fashion-preview.html">אופנה</a></li>
                <li><a href="data-manager-preview.html">ניהול נתונים</a></li>
                <li><a href="latest-news-preview.html">חדשות אחרונות</a></li>
                <li><a href="the-show-preview.html">המופע</a></li>
                <li><a href="login-preview.html">הרשמה</a></li>
            </ul>
        </nav>
    </header>

    <div class="auth-container">
        <div class="auth-box" id="authBox">
            <!-- Tab Buttons -->
            <div class="auth-tabs">
                <button class="tab-button active" onclick="switchTab('signup')">הרשמה / Sign Up</button>
                <button class="tab-button" onclick="switchTab('signin')">התחברות / Sign In</button>
            </div>

            <!-- Sign Up Tab -->
            <div class="tab-content active" id="signupTab">
                <h2>הצטרפו לחגיגה</h2>
                <p class="subtitle">UNITED BY MUSIC</p>
                
                <form onsubmit="handleSignup(event)">
                    <div class="input-group">
                        <label>שם מלא / Full Name</label>
                        <input type="text" id="signupName" placeholder="הכניסו שם מלא / Enter your name" required>
                    </div>

                    <div class="input-group">
                        <label>אימייל / Email</label>
                        <input type="email" id="signupEmail" placeholder="example@eurovision.com" required>
                    </div>

                    <div class="input-group">
                        <label>סיסמה / Password</label>
                        <input type="password" id="signupPassword" placeholder="********" required>
                    </div>

                    <button type="submit" class="btn">הצטרפו עכשיו / Join Now</button>
                </form>
                
                <a href="home-preview.html" class="back-link">← חזרה לדף הבית / Back to Home</a>
            </div>

            <!-- Sign In Tab -->
            <div class="tab-content" id="signinTab">
                <h2>ברוכים השבים</h2>
                <p class="subtitle">WELCOME BACK</p>
                
                <form onsubmit="handleSignin(event)">
                    <div class="input-group">
                        <label>אימייל / Email</label>
                        <input type="email" id="signinEmail" placeholder="example@eurovision.com" required>
                    </div>

                    <div class="input-group">
                        <label>סיסמה / Password</label>
                        <input type="password" id="signinPassword" placeholder="********" required>
                    </div>

                    <button type="submit" class="btn">התחברות / Sign In</button>
                </form>
                
                <a href="home-preview.html" class="back-link">← חזרה לדף הבית / Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        // Check if user is already signed in
        window.addEventListener('DOMContentLoaded', function() {
            const currentUser = JSON.parse(localStorage.getItem('euroUser') || 'null');
            const userDisplay = document.getElementById('userDisplay');
            
            if (currentUser) {
                // Update user display in header
                userDisplay.innerHTML = `<span>שלום ${currentUser.name}!</span> | <a href="#" onclick="logout()">התנתק / Logout</a>`;
                
                // Show "already signed in" message
                document.getElementById('authBox').innerHTML = `
                    <div class="already-signed-in">
                        <h3>✨ כבר מחובר! / Already Signed In ✨</h3>
                        <p>שלום ${currentUser.name}!</p>
                        <p>אתם כבר חלק ממשפחת האירוויזיון!<br>You're already part of the Eurovision family!</p>
                        <button class="btn" onclick="window.location.href='home-preview.html'">חזרה לדף הבית / Back to Home</button>
                        <button class="btn btn-secondary" onclick="logout()" style="margin-top: 15px;">התנתקות / Logout</button>
                    </div>
                `;
            }
        });

        function switchTab(tab) {
            // Update tab buttons
            const buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Update tab content
            document.getElementById('signupTab').classList.remove('active');
            document.getElementById('signinTab').classList.remove('active');
            
            if (tab === 'signup') {
                document.getElementById('signupTab').classList.add('active');
            } else {
                document.getElementById('signinTab').classList.add('active');
            }
        }

        function handleSignup(event) {
            event.preventDefault();
            
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;

            if (!name || !email || !password) {
                alert('אנא מלא את כל השדות / Please fill all fields');
                return;
            }

            // Check if user already exists
            const existingUsers = JSON.parse(localStorage.getItem('euroUsers') || '[]');
            const userExists = existingUsers.find(u => u.email === email);

            if (userExists) {
                alert('משתמש זה כבר רשום! עבור להתחברות / User already registered! Please sign in');
                switchTab('signin');
                document.getElementById('signinEmail').value = email;
                return;
            }

            // Save user
            const newUser = { name, email, password };
            existingUsers.push(newUser);
            localStorage.setItem('euroUsers', JSON.stringify(existingUsers));
            localStorage.setItem('euroUser', JSON.stringify(newUser));

            // Redirect to home
            alert(`ברוך הבא ${name}! Welcome to Eurovision!`);
            window.location.href = 'home-preview.html';
        }

        function handleSignin(event) {
            event.preventDefault();
            
            const email = document.getElementById('signinEmail').value;
            const password = document.getElementById('signinPassword').value;

            if (!email || !password) {
                alert('אנא מלא את כל השדות / Please fill all fields');
                return;
            }

            // Check credentials
            const existingUsers = JSON.parse(localStorage.getItem('euroUsers') || '[]');
            const user = existingUsers.find(u => u.email === email && u.password === password);

            if (!user) {
                alert('אימייל או סיסמה שגויים / Invalid email or password');
                return;
            }

            // Save current user
            localStorage.setItem('euroUser', JSON.stringify(user));

            // Redirect to home
            alert(`ברוך השב ${user.name}! Welcome back!`);
            window.location.href = 'home-preview.html';
        }

        function logout() {
            localStorage.removeItem('euroUser');
            alert('התנתקת בהצלחה / Successfully logged out');
            window.location.reload();
        }
    </script>
</body>
</html>
