<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PREVIEW - Eurovision Song Contest | Israel</title>
    <style>
        /* הגדרות צבעים ופונטים של האירוויזיון */
        :root {
            --euro-purple: #14052d;
            --euro-pink: #ff0085;
            --euro-yellow: #fdf200;
            --euro-blue: #00b1ea;
            --glass: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Montserrat', 'Segoe UI', sans-serif;
            background-color: var(--euro-purple);
            color: white;
            overflow-x: hidden;
        }

        /* סרגל ניווט שקוף ומודרני */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-sizing: border-box;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-container img {
            height: 60px;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
        }

        .user-display {
            font-size: 0.9rem;
            color: #fdf200;
            font-weight: 500;
        }

        .user-display a {
            color: #fdf200;
            text-decoration: none;
        }

        .user-display a:hover {
            text-decoration: underline;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 40px;
            margin: 0;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: var(--euro-pink);
            text-shadow: 0 0 8px var(--euro-pink);
        }

        /* אזור Hero עם רקע עוצמתי */
        .hero {
            position: relative;
            height: 100vh;
            width: 100%;
            background: linear-gradient(rgba(20, 5, 45, 0.4), var(--euro-purple)), 
                        url('https://static.eurovision.tv/hb-main/default/0001/05/ad7ca63546a362947d3419363065a396a804975e.jpeg') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* טקסט United By Music בסגנון המקורי */
        .hero h1 {
            font-size: 7vw;
            font-weight: 900;
            text-transform: uppercase;
            margin: 0;
            letter-spacing: -2px;
            line-height: 0.9;
            background: linear-gradient(to bottom, #fff, #ccc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5));
        }

        .hero p {
            font-size: 1.8rem;
            margin-top: 10px;
            font-weight: 300;
            color: var(--euro-yellow);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* כפתור הרשמה "וואו" */
        .btn-main {
            margin-top: 40px;
            padding: 20px 60px;
            background: var(--euro-pink);
            color: white;
            text-decoration: none;
            font-size: 1.4rem;
            font-weight: 900;
            border-radius: 100px;
            box-shadow: 0 0 30px rgba(255, 0, 133, 0.6);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid transparent;
            text-transform: uppercase;
        }

        .btn-main:hover {
            transform: scale(1.1);
            background: transparent;
            border-color: var(--euro-pink);
            box-shadow: 0 0 50px rgba(255, 0, 133, 0.8);
        }

        /* אלמנטים צפים של ניאון */
        .neon-line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--euro-blue), var(--euro-pink), var(--euro-yellow));
            box-shadow: 0 -5px 20px rgba(255, 0, 133, 0.5);
        }

    </style>
</head>
<body>
    
        <header>
            <div class="logo-container">
                <img src="https://www.eurovision.com/static/images/70-logo.ba56318cd52f.webp" alt="Eurovision 70" class="euro-logo">
                <div class="user-display" id="userDisplay">
                    <a href="login-preview.html">הרשמה / התחברות</a>
                </div>
            </div>
            <nav>
                <ul>
                    <li><a href="home-preview.html">דף הבית</a></li>
                    <li><a href="timeline-preview.html">ציר הזמן</a></li>
                    <li><a href="fashion-preview.html">אופנה</a></li>
                    <li><a href="data-manager-preview.html">ניהול נתונים</a></li>
                    <li><a href="login-preview.html">הרשמה</a></li>
                    <li><a href="latest-news-preview.html">חדשות אחרונות</a></li>
                    <li><a href="the-show-preview.html">המופע</a></li>
                </ul>
            </nav>
        </header>

        <section class="hero">
            <h1>מאוחדים על ידי מוזיקה</h1>
            <p>ישראל 2026</p>
            
            <a href="login-preview.html" class="btn-main" id="ctaButton">הצטרפו לחגיגה</a>

            <div class="neon-line"></div>
        </section>
    
    <script>
        // Display logged-in user
        window.addEventListener('DOMContentLoaded', function() {
            const currentUser = JSON.parse(localStorage.getItem('euroUser') || 'null');
            const userDisplay = document.getElementById('userDisplay');
            const ctaButton = document.getElementById('ctaButton');
            
            if (currentUser && userDisplay) {
                userDisplay.innerHTML = `<span>שלום ${currentUser.name}!</span> | <a href="#" onclick="logout(); return false;">התנתק</a>`;
                
                // Change CTA button for signed-in users
                if (ctaButton) {
                    ctaButton.href = 'timeline-preview.html';
                    ctaButton.textContent = `ברוך הבא ${currentUser.name}! גלה את המסע שלנו`;
                }
            }
        });

        function logout() {
            localStorage.removeItem('euroUser');
            alert('התנתקת בהצלחה / Successfully logged out');
            window.location.reload();
        }
    </script>
</body>
</html>
