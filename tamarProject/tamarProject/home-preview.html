<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ישראל באירוויזיון - דף הבית</title>
    <style>
        :root {
            --euro-purple: #14052d;
            --euro-pink: #ff0085;
            --euro-blue: #00b1ea;
            --euro-yellow: #fdf200;
            --deep-navy: #050514;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: linear-gradient(135deg, var(--deep-navy) 0%, var(--euro-purple) 100%);
            background-attachment: fixed;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        /* Navigation */
        .nav-menu {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .nav-button {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 2px solid var(--euro-pink);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-button:hover {
            background: var(--euro-pink);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255,0,133,0.4);
        }

        .nav-button.active {
            background: var(--euro-pink);
        }

        /* Main Container - Full Screen */
        .main-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .main-container::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,0,133,0.15) 0%, transparent 70%);
            animation: pulse 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        /* Hero Section - Compact */
        .hero {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--euro-pink), var(--euro-blue), var(--euro-yellow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInDown 0.8s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .subtitle {
            font-size: 1.2rem;
            color: #e0e0e0;
            margin-bottom: 20px;
        }

        /* Stats - Compact Inline */
        .stats-inline {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
            position: relative;
            z-index: 2;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--euro-pink);
        }

        .stat-label {
            font-size: 0.9rem;
            color: #ccc;
            margin-top: 5px;
        }

        /* Pages Grid - Compact */
        .pages-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            max-width: 1200px;
            position: relative;
            z-index: 2;
        }

        .page-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 25px 15px;
            text-decoration: none;
            color: white;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .page-card:hover {
            transform: translateY(-8px);
            border-color: var(--euro-pink);
            box-shadow: 0 10px 30px rgba(255, 0, 133, 0.4);
        }

        .page-icon {
            font-size: 2.5rem;
        }

        .page-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--euro-pink);
            text-align: center;
        }

        .page-description {
            font-size: 0.85rem;
            text-align: center;
            color: #ccc;
            line-height: 1.3;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .pages-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .stats-inline {
                gap: 20px;
                flex-wrap: wrap;
            }

            .stat-number {
                font-size: 2rem;
            }

            .stat-label {
                font-size: 0.8rem;
            }

            .pages-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .page-card {
                padding: 20px 10px;
            }

            .page-icon {
                font-size: 2rem;
            }

            .page-name {
                font-size: 1rem;
            }

            .page-description {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Menu -->
    <nav class="nav-menu">
        <a href="home-preview.html" class="nav-button active">
            <span>🏠</span>
            <span>HOME</span>
        </a>
    </nav>

    <!-- Main Container - Everything in One Screen -->
    <div class="main-container">
        <!-- Hero Section -->
        <div class="hero">
            <h1>ישראל באירוויזיון</h1>
            <p class="subtitle">מסע מוזיקלי, תרבותי ואופנתי מ-1973 ועד היום</p>
        </div>

        <!-- Statistics Inline -->
        <div class="stats-inline">
            <div class="stat-item">
                <div class="stat-number">54</div>
                <div class="stat-label">שנים</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">4</div>
                <div class="stat-label">ניצחונות</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">1973</div>
                <div class="stat-label">שנה ראשונה</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">2018</div>
                <div class="stat-label">ניצחון אחרון</div>
            </div>
        </div>

        <!-- Pages Grid -->
        <div class="pages-grid">
            <a href="timeline-preview-splitview.html" class="page-card">
                <div class="page-icon">⏰</div>
                <div class="page-name">ציר הזמן</div>
                <div class="page-description">כל השנים אינטראקטיבי</div>
            </a>

            <a href="fashion-preview.html" class="page-card">
                <div class="page-icon">👗</div>
                <div class="page-name">אופנה</div>
                <div class="page-description">סגנון לאורך השנים</div>
            </a>

            <a href="choreography-preview.html" class="page-card">
                <div class="page-icon">💃</div>
                <div class="page-name">כוריאוגרפיה</div>
                <div class="page-description">ריקוד וביצוע במה</div>
            </a>

            <a href="national-mood-preview.html" class="page-card">
                <div class="page-icon">🌍</div>
                <div class="page-name">הלך רוח לאומי</div>
                <div class="page-description">ביטוי דרך השירים</div>
            </a>

            <a href="data-manager-preview.html" class="page-card">
                <div class="page-icon">📊</div>
                <div class="page-name">ניהול נתונים</div>
                <div class="page-description">עריכת מידע</div>
            </a>
        </div>
    </div>
</body>
</html>
