<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Israel at Eurovision</title>
    <style>
        :root {
            --euro-purple: #14052d;
            --euro-pink: #ff0085;
            --euro-blue: #00b1ea;
            --euro-yellow: #fdf200;
            --deep-navy: #050514;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--deep-navy) 0%, var(--euro-purple) 100%);
            color: white;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Floating Shapes Background */
        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .shape {
            position: absolute;
            opacity: 0.1;
            animation: float 20s infinite ease-in-out;
        }

        .shape:nth-child(1) {
            top: 10%;
            left: 10%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--euro-pink), transparent);
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            top: 60%;
            right: 10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--euro-blue), transparent);
            animation-delay: 7s;
        }

        .shape:nth-child(3) {
            bottom: 10%;
            left: 50%;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, var(--euro-yellow), transparent);
            animation-delay: 14s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -50px) scale(1.1); }
            66% { transform: translate(-30px, 30px) scale(0.9); }
        }

        /* Navigation Menu - LEFT SIDE */
        .top-nav {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(20, 5, 45, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .top-nav ul {
            list-style: none;
            display: flex;
            gap: 40px;
            margin: 0;
            padding: 0;
        }

        .top-nav ul li a {
            text-decoration: none;
            color: white;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .top-nav ul li a:hover {
            color: var(--euro-pink);
            text-shadow: 0 0 8px var(--euro-pink);
        }

        /* Eurovision 70 Logo - RIGHT SIDE */
        .euro-logo {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 150px;
            height: auto;
            z-index: 1000;
            filter: drop-shadow(0 0 20px rgba(255, 0, 133, 0.3));
        }

        /* User Display - BELOW LOGO ON RIGHT */
        .user-display {
            position: fixed;
            top: 115px;
            right: 30px;
            color: var(--euro-yellow);
            font-weight: 600;
            z-index: 1001;
            font-size: 0.9rem;
            background: rgba(20, 5, 45, 0.7);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-display a {
            color: var(--euro-yellow);
            text-decoration: none;
            transition: 0.3s;
        }

        .user-display a:hover {
            color: #fff;
            text-shadow: 0 0 8px var(--euro-yellow);
        }

        /* Gallery Section */
        .gallery-section {
            position: relative;
            z-index: 10;
            padding: 100px 5% 80px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .gallery-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .gallery-header h1 {
            font-size: 4em;
            font-weight: 900;
            margin-bottom: 15px;
            background: linear-gradient(135deg, white, var(--euro-pink), var(--euro-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInDown 1s ease;
        }

        .gallery-header p {
            font-size: 1.3em;
            color: rgba(255,255,255,0.8);
            max-width: 700px;
            margin: 0 auto;
        }

        /* Filter Buttons */
        .filter-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 12px 30px;
            background: rgba(255,255,255,0.1);
            border: 2px solid var(--euro-pink);
            border-radius: 25px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--euro-pink);
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(255,0,133,0.4);
        }

        /* Gallery Grid - Masonry Style */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            grid-auto-rows: 250px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.4s ease;
            background: #1a1a1a;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .gallery-item:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(255,0,133,0.4);
        }

        /* Vary item sizes for masonry effect */
        .gallery-item:nth-child(3n + 1) {
            grid-row: span 2;
        }

        .gallery-item:nth-child(5n + 2) {
            grid-row: span 1;
        }

        .gallery-item:nth-child(7n + 3) {
            grid-column: span 2;
        }

        .gallery-item img,
        .gallery-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .gallery-item:hover img,
        .gallery-item:hover video {
            transform: scale(1.1);
        }

        .gallery-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .gallery-item:hover .gallery-overlay {
            opacity: 1;
        }

        .gallery-overlay h3 {
            font-size: 1.2em;
            margin-bottom: 5px;
            color: var(--euro-yellow);
        }

        .gallery-overlay p {
            font-size: 0.9em;
            color: rgba(255,255,255,0.8);
        }

        /* Video Play Icon */
        .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            background: rgba(255,0,133,0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            transition: all 0.3s;
        }

        .gallery-item:hover .play-icon {
            transform: translate(-50%, -50%) scale(1.2);
            background: var(--euro-pink);
        }

        /* Lightbox Modal */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
        }

        .lightbox-content img,
        .lightbox-content video {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 10px;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 3em;
            color: white;
            cursor: pointer;
            z-index: 2001;
            background: var(--euro-pink);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .lightbox-close:hover {
            transform: rotate(90deg);
            background: white;
            color: var(--euro-pink);
        }

        /* Israel Flag */
        .carousel-winner-flag {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 100;
            animation: flagFloat 6s infinite ease-in-out;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
        }

        @keyframes flagFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 15px;
            }

            .gallery-item:nth-child(7n + 3) {
                grid-column: span 1;
            }

            .gallery-header h1 {
                font-size: 2.5em;
            }

            nav ul {
                gap: 15px;
            }

            nav ul li a {
                font-size: 0.75rem;
            }
        }
    </style>

            { year: 2026, title: "2026 - Noam Batan - TBA", image: "2026.webp", category: "performances" }
        ];

        let currentFilter = 'all';

        // Populate gallery on page load
        function populateGallery(filter = 'all') {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';

            const filteredData = filter === 'all' 
                ? galleryData 
                : galleryData.filter(item => item.category === filter);

            filteredData.forEach((item, index) => {
                const galleryItem = document.createElement('div');
                galleryItem.className = 'gallery-item';
                galleryItem.onclick = () => openLightbox(item);

                const ext = item.image.split('.').pop().toLowerCase();
                const isVideo = ext === 'mov' || ext === 'mp4';

                galleryItem.innerHTML = `
                    ${isVideo ? `<video src="images/eurovision/${item.image}"></video>` : `<img src="images/eurovision/${item.image}" alt="${item.title}">`}
                    ${isVideo ? '<div class="play-icon">▶</div>' : ''}
                    <div class="gallery-overlay">
                        <h3>${item.year}</h3>
                        <p>${item.title}</p>
                    </div>
                `;

                grid.appendChild(galleryItem);
            });
        }

        // Filter gallery
        function filterGallery(category) {
            currentFilter = category;
            
            // Update active button
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Repopulate gallery
            populateGallery(category);
        }

        // Lightbox functions
        function openLightbox(item) {
            const lightbox = document.getElementById('lightbox');
            const content = document.getElementById('lightboxContent');
            
            const ext = item.image.split('.').pop().toLowerCase();
            const isVideo = ext === 'mov' || ext === 'mp4';

            if (isVideo) {
                content.innerHTML = `
                    <video controls autoplay style="max-width: 100%; max-height: 90vh;">
                        <source src="images/eurovision/${item.image}" type="video/${ext === 'mov' ? 'quicktime' : 'mp4'}">
                    </video>
                `;
            } else {
                content.innerHTML = `<img src="images/eurovision/${item.image}" alt="${item.title}">`;
            }

            lightbox.classList.add('active');
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            const content = document.getElementById('lightboxContent');
            lightbox.classList.remove('active');
            content.innerHTML = '';
        }

        // Close lightbox on click outside
        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) {
                closeLightbox();
            }
        });

        // Initialize gallery
        window.addEventListener('DOMContentLoaded', function() {
            populateGallery();

            // Display logged-in user
            // Display logged-in user
            const currentUser = JSON.parse(localStorage.getItem('euroUser') || 'null');
            const userDisplay = document.getElementById('userDisplay');
            
            if (currentUser && userDisplay) {
                userDisplay.innerHTML = `<span>Hello ${currentUser.name}!</span> | <a href="#" onclick="logout(); return false;">Logout</a>`;
            }
        });

        function logout() {
            localStorage.removeItem('euroUser');
            alert('Successfully logged out');
            window.location.reload();
        }
    </script>
