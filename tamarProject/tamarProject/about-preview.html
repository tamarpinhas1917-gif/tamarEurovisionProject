<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>PREVIEW - </title>

    <link rel="stylesheet" type="text/css" href="StyleMenu.css" />
    <style>
        :root {
            --euro-purple: #14052d;
            --euro-pink: #ff0085;
            --euro-blue: #00b1ea;
            --euro-yellow: #fdf200;
            --deep-navy: #050514;
        }
        
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--deep-navy) 0%, var(--euro-purple) 100%);
            background-attachment: fixed;
            overflow-x: hidden;
            position: relative;
        }
        
        .floating-shape {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 1;
            animation: float 20s infinite ease-in-out;
        }
        
        .shape1 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--euro-pink), transparent);
            top: 10%;
            left: 5%;
            animation-delay: 0s;
        }
        
        .shape2 {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, var(--euro-blue), transparent);
            top: 60%;
            right: 10%;
            animation-delay: 4s;
        }
        
        .shape3 {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, var(--euro-yellow), transparent);
            bottom: 15%;
            left: 15%;
            animation-delay: 8s;
        }
        
        .shape4 {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, var(--euro-purple), transparent);
            top: 40%;
            left: 40%;
            animation-delay: 12s;
        }
        
        .shape5 {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, var(--euro-pink), transparent);
            bottom: 30%;
            right: 25%;
            animation-delay: 16s;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(30px, -30px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
        }
        
        .euro-heart-decoration {
            position: fixed;
            top: 80px;
            right: 40px;
            width: 120px;
            height: auto;
            z-index: 10;
            opacity: 0.9;
            pointer-events: none;
            animation: gentleFloat 6s ease-in-out infinite;
        }
        
        .euro-heart-decoration-2 {
            position: fixed;
            bottom: 40px;
            left: 40px;
            width: 100px;
            height: auto;
            z-index: 10;
            opacity: 0.8;
            pointer-events: none;
            animation: gentleFloat 8s ease-in-out infinite;
            animation-delay: 2s;
        }
        
        .carousel-winner-flag {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 80px;
            height: auto;
            z-index: 10;
            opacity: 0.9;
            pointer-events: none;
            animation: gentleFloat 7s ease-in-out infinite;
            animation-delay: 1s;
        }
        
        @keyframes gentleFloat {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        /* סרגל ניווט שקוף ומודרני */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-sizing: border-box;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-container img {
            height: 60px;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .logo-container img:hover {
            transform: scale(1.05);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 40px;
            margin: 0;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: var(--euro-pink);
            text-shadow: 0 0 8px var(--euro-pink);
        }
    </style>
</head>
