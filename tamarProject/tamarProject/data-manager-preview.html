<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 ניהול נתונים - ישראל באירוויזיון</title>
    <style>
        :root {
            --euro-purple: #14052d;
            --euro-pink: #ff0085;
            --euro-blue: #00b1ea;
            --euro-yellow: #fdf200;
            --deep-navy: #050514;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: linear-gradient(135deg, var(--deep-navy) 0%, var(--euro-purple) 100%);
            background-attachment: fixed;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        /* Navigation */
        .nav-menu {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .nav-button {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 2px solid var(--euro-pink);
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-button:hover {
            background: var(--euro-pink);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255,0,133,0.4);
        }

        .container {
            max-width: 1600px;
            margin: 80px auto 40px;
        }

        h1 {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(135deg, var(--euro-pink), var(--euro-yellow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            font-size: 1.2rem;
            color: #e0e0e0;
            margin-bottom: 40px;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 20px 40px;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--euro-pink);
        }

        .stat-label {
            font-size: 1rem;
            color: #ccc;
            margin-top: 5px;
        }

        .data-table-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: rgba(255, 0, 133, 0.2);
            position: sticky;
            top: 0;
        }

        th {
            padding: 15px;
            text-align: right;
            font-weight: 700;
            color: var(--euro-yellow);
            border-bottom: 2px solid var(--euro-pink);
        }

        td {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        tr:hover {
            background: rgba(255, 0, 133, 0.1);
        }

        .year-col {
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--euro-pink);
        }

        .rank-col {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .rank-1 { color: #ffd700; }
        .rank-2 { color: #c0c0c0; }
        .rank-3 { color: #cd7f32; }

        .tags {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .tag {
            background: rgba(0, 177, 234, 0.3);
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.85rem;
            color: var(--euro-blue);
            border: 1px solid var(--euro-blue);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .data-table-container {
                padding: 15px;
            }

            th, td {
                padding: 10px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Menu -->
    <nav class="nav-menu">
        <a href="home-preview.html" class="nav-button">
            <span>🏠</span>
            <span>HOME</span>
        </a>
    </nav>

    <div class="container">
        <h1>📊 ניהול נתונים</h1>
        <p class="subtitle">כל אירועי האירוויזיון של ישראל - 1973 עד היום</p>

        <!-- Statistics -->
        <div class="stats-bar">
            <div class="stat-box">
                <div class="stat-number" id="totalYears">0</div>
                <div class="stat-label">שנים</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="totalVictories">0</div>
                <div class="stat-label">ניצחונות</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="totalMedals">0</div>
                <div class="stat-label">מדליות (1-3)</div>
            </div>
        </div>

        <!-- Data Table -->
        <div class="data-table-container">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>שנה</th>
                        <th>אמן</th>
                        <th>שיר</th>
                        <th>דירוג</th>
                        <th>סאונד</th>
                        <th>אופנה</th>
                        <th>שפה</th>
                        <th>כוריאוגרפיה</th>
                        <th>תגיות</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Load data from JSON file
        async function loadData() {
            try {
                const response = await fetch('App_Data/eurovision-data.json');
                const data = await response.json();
                
                // Update statistics
                document.getElementById('totalYears').textContent = data.length;
                const victories = data.filter(d => d.Rank === 1).length;
                const medals = data.filter(d => d.Rank && d.Rank <= 3).length;
                document.getElementById('totalVictories').textContent = victories;
                document.getElementById('totalMedals').textContent = medals;

                // Populate table
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = data.map(item => {
                    const rankClass = item.Rank <= 3 ? `rank-${item.Rank}` : '';
                    const tagsHtml = item.Tags ? item.Tags.map(tag => 
                        `<span class="tag">${tag}</span>`
                    ).join('') : '';

                    return `
                        <tr>
                            <td class="year-col">${item.Year}</td>
                            <td><strong>${item.Artist}</strong><br><small>${item.ArtistEnglish || ''}</small></td>
                            <td><strong>${item.Song}</strong><br><small>${item.SongEnglish || ''}</small></td>
                            <td class="${rankClass}">${item.Rank || 'N/A'}</td>
                            <td><small>${item.Sound || ''}</small></td>
                            <td><small>${item.Fashion || ''}</small></td>
                            <td><small>${item.Language || ''}</small></td>
                            <td><small>${item.Choreography || ''}</small></td>
                            <td><div class="tags">${tagsHtml}</div></td>
                        </tr>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('tableBody').innerHTML = 
                    '<tr><td colspan="9" style="text-align:center; padding:40px; color:var(--euro-pink);">שגיאה בטעינת הנתונים. אנא וודא שהשרת פועל.</td></tr>';
            }
        }

        // Load data when page loads
        loadData();
    </script>
</body>
</html>
